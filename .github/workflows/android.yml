name: Native Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-parity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            native-parity/**/*.gradle
            native-parity/gradle/wrapper/gradle-wrapper.properties
      - name: Ensure Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Public source guard
        working-directory: .
        run: python tools/audit_public_tree.py
      - name: Tests, lint, APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Reports and development APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-checks
          retention-days: 7
          path: |
            native-parity/app/build/reports/
            native-parity/app/build/test-results/
            native-parity/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
